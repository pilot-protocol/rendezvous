name: Notify Canary

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

# PILOT-113: explicit minimal permissions. Default GITHUB_TOKEN scope
# is write-all; this workflow only needs to read the repo and dispatch
# an external event using a PAT secret.
permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'pilot-protocol',
              repo: 'pilot-canary',
              event_type: 'canary-build',
              client_payload: { repo: 'rendezvous', ref: context.sha }
            });
