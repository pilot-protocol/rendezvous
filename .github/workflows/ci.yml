name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7.0.0
        with:
          path: rendezvous

      - name: Checkout web4
        uses: actions/checkout@v7.0.0
        with:
          repository: pilot-protocol/pilotprotocol
          path: web4

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: rendezvous/go.mod
          cache: true
          cache-dependency-path: rendezvous/go.sum

      - name: Run tests with coverage
        working-directory: rendezvous
        # -parallel 4 caps concurrent test parallelism: unbounded parallelism
        # exhausts ephemeral ports/sockets in the registry's integration tests
        # and causes spurious dial timeouts (project convention).
        run: go test -race -parallel 4 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./rendezvous/coverage.out
          flags: unittests
          name: rendezvous
          fail_ci_if_error: false

      - name: Coverage summary
        working-directory: rendezvous
        run: go tool cover -func=coverage.out | tail -20

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rendezvous
          path: rendezvous/coverage.out
          retention-days: 30
